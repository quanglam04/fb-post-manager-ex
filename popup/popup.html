<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Manager</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sb-bg:      #0c0c18;
      --main-bg:    #101020;
      --card-bg:    #141428;
      --accent:     #1cc4a0;
      --accent-bg:  rgba(28, 196, 160, 0.12);
      --danger:     #e04444;
      --blue:       #5b8ef0;
      --text:       #e8e8f5;
      --muted:      #7070a0;
      --border:     rgba(255,255,255,0.07);
      --radius:     8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--sb-bg);
      color: var(--text);
      width: 240px;
      min-height: 200px;
      overflow: hidden;
    }

    .popup-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Header */
    .popup-header {
      padding: 16px 16px 12px;
      background: linear-gradient(135deg, #0c0c18 0%, #14142a 100%);
      border-bottom: 1px solid var(--border);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #1cc4a0, #5b8ef0);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* Status badge */
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid;
      transition: all 0.2s;
    }

    .status-row.ok {
      background: rgba(28,196,160,0.1);
      border-color: rgba(28,196,160,0.25);
      color: #1cc4a0;
    }

    .status-row.warn {
      background: rgba(224,160,32,0.1);
      border-color: rgba(224,160,32,0.25);
      color: #e0a020;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-row.ok .status-dot { background: #1cc4a0; }
    .status-row.warn .status-dot { background: #e0a020; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Body */
    .popup-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Open Dashboard button */
    .btn-dashboard {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #1cc4a0, #17a88a);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13.5px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }

    .btn-dashboard:hover {
      background: linear-gradient(135deg, #22d4ae, #1cc4a0);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(28,196,160,0.35);
    }

    .btn-dashboard:active {
      transform: translateY(0);
    }

    .btn-dashboard svg {
      width: 15px;
      height: 15px;
    }

    /* Quick links */
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
      border-bottom: 1px solid var(--border);
    }

    .quick-link:last-child { border-bottom: none; }

    .quick-link:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }

    .quick-link .ql-icon { font-size: 14px; }
    .quick-link .ql-label { flex: 1; }
    .quick-link .ql-arrow { opacity: 0.4; font-size: 10px; }

    /* Footer */
    .popup-footer {
      padding: 8px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
    }

    .footer-text {
      font-size: 10.5px;
      color: var(--muted);
      opacity: 0.6;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(28,196,160,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="popup-wrap">
    <!-- Header -->
    <div class="popup-header">
      <div class="logo-row">
        <div class="logo-icon">FM</div>
        <div class="logo-text">
          <span class="logo-name">FB Manager</span>
          <span class="logo-sub">Premium Dashboard</span>
        </div>
      </div>
      <div id="status-row" class="status-row warn">
        <div class="spinner"></div>
        <span id="status-text">Đang kiểm tra...</span>
      </div>
    </div>

    <!-- Body -->
    <div class="popup-body">
      <button class="btn-dashboard" id="btn-open-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        Mở Dashboard
      </button>

      <div class="quick-links">
        <button class="quick-link" data-section="posts">
          <span class="ql-icon">📝</span>
          <span class="ql-label">My Posts</span>
          <span class="ql-arrow">›</span>
        </button>
        <button class="quick-link" data-section="groups">
          <span class="ql-icon">👥</span>
          <span class="ql-label">Joined Groups</span>
          <span class="ql-arrow">›</span>
        </button>
        <button class="quick-link" data-section="friends">
          <span class="ql-icon">❤️</span>
          <span class="ql-label">Friends</span>
          <span class="ql-arrow">›</span>
        </button>
      </div>
      <button class="btn-dashboard" id="reloadBtn" style="background: linear-gradient(135deg, #5b8ef0, #3f70d9); margin-top: 4px;">
        🔄 Reload Extension
      </button>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span class="footer-text">FB Manager v1.0.0 · MV3</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
